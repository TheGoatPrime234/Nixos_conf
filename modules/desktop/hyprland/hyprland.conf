monitor=eDP-1,1920x1080@144,auto,1
monitor=HMDI-A-1,1920x1080@60,auto,1

exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP PATH
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP PATH
exec-once = blueman-applet
exec-once = kitty --start-as=hidden
exec-once = nix-timetracker daemon
exec-once = systemctl --user start noctalia

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = LIBVA:DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = QML_XHR_ALLOW_FILE_READ,1

$terminal = kitty
$fileManager = yazi 
$menu = rofi -show drun

$mainMod = SUPER # Sets "Windows" key as main modifier

# Terminal: Kitty
bind = $mainMod, Q, exec, $terminal
bind = $mainMod SHIFT, Q, exec, $terminal --hold fastfetch

# Hyprland and Window Managment
bind = $mainMod, C, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, J, togglesplit, # dwindle

# Pulsemixer
bind = $mainMod, G, exec, kitty --class volumemixer -e pulsemixer || pkill pulsemixer

# FileManager: Yazi
bind = $mainMod, E, exec, [float; size: 35% 40%] kitty yazi 

# Browser: Zen-Browser
bind = $mainMod, B, exec, zen-beta

# Obsidian
bind = $mainMod, O, exec, obsidian

# Hyprland Reload
bind = $mainMod, R, exec, hyprctl reload

# Quickshell IPC Handler
bind = $mainMod, TAB, exec, qs ipc call gearwheel toggle

# Noctalia
bind = $mainMod, Space, exec, noctalia msg panel-toggle control-center home
bind = $mainMod, M, exec, noctalia msg panel-toggle wallpaper
bind = $mainMod, F, exec, noctalia msg panel-toggle launcher
bind = $mainMod, N, exec, noctalia msg wallpaper-next
bind = $mainMod SHIFT, N, exec, noctalia msg wallpaper-previous

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move focus with mainMod + vim arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Fenster verschieben
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2.5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2.5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+  
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next && notify-send "Nächster Titel" "$(playerctl metadata title) -a playerctl"

# Fullscreen
bind = $mainMod, F11, fullscreen

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" - | tee /home/cato/screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy && notify-send "Saved Screenshot" -a grim -t 3000

input {
    kb_layout = de
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    repeat_rate = 25
    repeat_delay = 300

    follow_mouse = 1
    accel_profile = flat

    sensitivity = 0 
    touchpad {
        natural_scroll = false
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

xwayland {
    force_zero_scaling = true
}

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    resize_on_border = true
    layout = dwindle # Behält das Kachel-Layout bei
}

decoration {
    rounding = 15
    active_opacity = 0.8
    inactive_opacity = 0.50

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = false
        xray = false
    }
    shadow {
    	enabled = true
	range = 8
	offset = 1 1  
    }
}

animations {
    enabled = yes
    bezier = easeOutExpo, 0.16, 1, 0.3, 1

    animation = windows, 1, 4, easeOutExpo, popin 80%
    animation = windowsOut, 1, 4, easeOutExpo, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, easeOutExpo, slide
}

misc {
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    disable_hyprland_logo = true
}

# Layout-spezifische Einstellungen
dwindle {
    pseudotile = yes 
    preserve_split = yes 
}

master {
    new_status = master
}

windowrulev2 = suppressevent maximize, class:.*

windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

windowrulev2 = float, class:^(hyprland-run)$
windowrulev2 = move 20 100%-120, class:^(hyprland-run)$

windowrulev2 = float, class:^(volumemixer)$
windowrulev2 = size 700 400, class:^(volumemixer)$
windowrulev2 = center, class:^(volumemixer)$

windowrulev2 = float, class:^(kitty-floating)$
windowrulev2 = center, class:^(kitty-floating)$
windowrulev2 = size 1000 600, class:^(kitty-floating)$

# For Noctalia Color templates
source = ~/.config/hypr/noctalia.conf
